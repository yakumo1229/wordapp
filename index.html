<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>単語クイズ - word-app-sokutan</title>
    <style>
        :root {
            --primary: #4CAF50;
            --primary-hover: #43a047;
            --error: #f44336;
            --bg: #f5f7fa;
            --text: #333;
            --card-bg: #ffffff;
        }
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            background: var(--bg); 
            color: var(--text);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 10px;
            box-sizing: border-box;
        }
        .container { 
            background: var(--card-bg); 
            width: 100%; 
            max-width: 420px; 
            padding: 2rem; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
            text-align: center; 
            box-sizing: border-box;
        }
        .hidden { display: none !important; }
        
        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: #2c3e50;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 25px;
        }
        
        /* セクション・問題数設定ラベル */
        .select-label {
            text-align: left;
            font-weight: bold;
            font-size: 0.9rem;
            margin: 15px 0 5px 2px;
            color: #34495e;
        }

        /* セレクトボックス */
        select { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 15px; 
            border-radius: 8px; 
            border: 2px solid #e2e8f0; 
            font-size: 1rem;
            background-color: #fff;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        select:focus {
            border-color: var(--primary);
        }
        
        /* ボタンのデザイン */
        button { 
            width: 100%; 
            padding: 14px; 
            margin: 8px 0; 
            border: 2px solid #edf2f7; 
            border-radius: 10px; 
            background: white; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            font-size: 1rem; 
            font-weight: 600;
            color: #4a5568;
            box-sizing: border-box;
        }
        button:hover:not(:disabled) { 
            background: #f7fafc; 
            border-color: #cbd5e0; 
            transform: translateY(-1px);
        }
        button:active:not(:disabled) {
            transform: translateY(1px);
        }
        button:disabled { 
            cursor: not-allowed; 
            opacity: 0.8; 
        }
        
        .start-btn { 
            background: var(--primary); 
            color: white; 
            border: none; 
            font-weight: bold; 
            margin-top: 25px; 
            font-size: 1.1rem;
            box-shadow: 0 4px 6px rgba(76, 175, 80, 0.15);
        }
        .start-btn:hover { 
            background: var(--primary-hover); 
            box-shadow: 0 6px 12px rgba(76, 175, 80, 0.25);
        }
        
        /* クイズ演出用 */
        .correct { 
            background-color: #e6fffa !important; 
            border-color: var(--primary) !important; 
            color: #234e52 !important; 
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.2);
        }
        .wrong { 
            background-color: #fff5f5 !important; 
            border-color: var(--error) !important; 
            color: #742a2a !important; 
            box-shadow: 0 0 8px rgba(244, 67, 54, 0.2);
        }
        
        .shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        
        #progress { 
            font-size: 0.95rem; 
            color: #718096; 
            margin-bottom: 15px; 
            font-weight: bold;
        }
        #question-meaning { 
            margin: 25px 0; 
            min-height: 4em; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 1.4rem;
            line-height: 1.4;
            color: #2d3748;
            border-bottom: 2px dashed #edf2f7;
            padding-bottom: 20px;
        }

        #loading-overlay {
            color: #4a5568;
            font-weight: 500;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* エラー・デバッグ表示用スタイル */
        .error-box {
            background-color: #fff5f5;
            border: 1px solid #feb2b2;
            color: #c53030;
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: left;
            font-size: 0.85rem;
            word-break: break-all;
            max-height: 150px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- 1. 設定画面 -->
    <div id="home-screen">
        <h1>単語学習クイズ</h1>
        <p class="subtitle">word-app-sokutan</p>
        
        <div class="select-label">セクションを選択</div>
        <select id="section-select">
            <option value="1">Section 1</option>
            <option value="2">Section 2</option>
            <option value="3">Section 3</option>
            <option value="4">Section 4</option>
            <option value="5">Section 5</option>
            <option value="6">Section 6</option>
            <option value="7">Section 7</option>
            <option value="8">Section 8</option>
            <option value="9">Section 9</option>
            <option value="10">Section 10</option>
        </select>
        
        <div class="select-label">問題数</div>
        <select id="count-select">
            <option value="5">5問</option>
            <option value="10" selected>10問</option>
            <option value="20">20問</option>
            <option value="30">30問</option>
        </select>
        
        <button class="start-btn" onclick="startQuiz()">学習開始！</button>

        <!-- 開発時用：エラーログ確認エリア -->
        <div id="debug-area" class="error-box hidden">
            <strong>【デバッグエラー情報】</strong>
            <div id="debug-message"></div>
        </div>
    </div>

    <!-- ローディング表示 -->
    <div id="loading-overlay" class="hidden">
        <div class="spinner"></div>
        <p id="loading-text">データを取得中...</p>
    </div>

    <!-- 2. クイズ画面 -->
    <div id="quiz-screen" class="hidden">
        <div id="progress">1 / 10</div>
        <h2 id="question-meaning">読み込み中...</h2>
        <div id="choices-area">
            <!-- ボタンが動的に生成される -->
        </div>
    </div>

    <!-- 3. 結果画面 -->
    <div id="result-screen" class="hidden">
        <h2>結果発表</h2>
        <p id="final-score" style="font-size: 1.6rem; font-weight: bold; color: var(--primary); margin: 25px 0;"></p>
        <button class="start-btn" onclick="location.reload()">もう一度解く</button>
    </div>
</div>

<script type="module">
    // Firebase SDKの読み込み
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, doc, getDoc, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // --- Firebaseの設定 ---
    const firebaseConfig = {
        apiKey: "AIzaSyD3kROMBvsbOScqTomHWzQrgibk1SGyRrk",
        authDomain: "word-app-sokutan.firebaseapp.com",
        projectId: "word-app-sokutan",
        storageBucket: "word-app-sokutan.appspot.com",
        messagingSenderId: "891824625031",
        appId: "G-G478K2FX6P"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // AudioContextの初期化
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playTone(freq, type, duration) {
        try {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) {
            console.warn("Audio playback failed:", e);
        }
    }

    let quizDataList = [];
    let currentIndex = 0;
    let score = 0;

    // デバッグメッセージを表示する関数
    function showDebug(msg) {
        const debugArea = document.getElementById("debug-area");
        const debugMsg = document.getElementById("debug-message");
        debugArea.classList.remove("hidden");
        debugMsg.innerHTML += `<div>${msg}</div>`;
    }

    // クイズ開始
    window.startQuiz = async () => {
        initAudio(); 
        
        const sectionVal = document.getElementById("section-select").value;
        const count = parseInt(document.getElementById("count-select").value);

        // UI切り替え
        document.getElementById("home-screen").classList.add("hidden");
        document.getElementById("loading-overlay").classList.remove("hidden");

        const sectionNum = parseInt(sectionVal);
        const sectionStr = String(sectionVal);
        const zeroPaddedSection = String(sectionNum).padStart(2, '0');

        // 調査対象のFirestoreパスのパターン（自動切り替え用）
        // ルートの "vocabulary" と ネストされた "/artifacts/word-app-sokutan/public/data/vocabulary"
        const possibleCollections = [
            collection(db, "vocabulary"),
            collection(db, "artifacts", "word-app-sokutan", "public", "data", "vocabulary")
        ];

        let snap = null;
        let finalCollectionRef = null;

        try {
            // パターン1: ルートまたは指定コレクションを網羅的に探す
            for (const colRef of possibleCollections) {
                showDebug(`データベース探索中: ${colRef.path}...`);
                
                // 1-A. 数値としてクエリをかける
                const qNum = query(colRef, where("section", "==", sectionNum), limit(150));
                snap = await getDocs(qNum);
                
                // 1-B. 空なら文字列としてクエリをかける
                if (snap.empty) {
                    const qStr = query(colRef, where("section", "==", sectionStr), limit(150));
                    snap = await getDocs(qStr);
                }

                // 1-C. それでも空ならゼロパディング "01" で試す
                if (snap.empty) {
                    const qPad = query(colRef, where("section", "==", zeroPaddedSection), limit(150));
                    snap = await getDocs(qPad);
                }

                // データが見つかれば探索を終了する
                if (!snap.empty) {
                    finalCollectionRef = colRef;
                    showDebug(`データの取得に成功しました！(パス: ${colRef.path})`);
                    break;
                }
            }

            // それでも全く見つからない場合は、コレクション全体の状況（そもそも読み取り自体ができるか）をテスト
            if (!snap || snap.empty) {
                showDebug(`全探索パターンで指定のセクションデータが見つかりませんでした。セキュリティルールまたはセクションの表記が合致していません。`);
                
                // コレクション内の先頭ドキュメントを1件テストフェッチ（接続・ルール・パス自体が生きているかのテスト）
                for (const colRef of possibleCollections) {
                    try {
                        const testQ = query(colRef, limit(1));
                        const testSnap = await getDocs(testQ);
                        if (!testSnap.empty) {
                            const sample = testSnap.docs[0].data();
                            showDebug(`[テスト疎通成功] パス ${colRef.path} にデータは存在します。例: word=${sample.word}, section=${sample.section} (型の確認: ${typeof sample.section})`);
                        } else {
                            showDebug(`[テスト疎通] パス ${colRef.path} は空っぽ、またはドキュメントが存在しません。`);
                        }
                    } catch (testErr) {
                        showDebug(`[テスト疎通失敗] パス ${colRef.path} へのアクセス権がありません: ${testErr.message}`);
                    }
                }
                
                throw new Error("NoVocabularyDataFound");
            }

            // 取得したドキュメントを配列に変換
            quizDataList = snap.docs.map(doc => {
                const data = doc.data();
                return {
                    id: doc.id,
                    ...data
                };
            });

            // 取得できた中からシャッフルして指定問題数に制限
            quizDataList.sort(() => Math.random() - 0.5);
            if (quizDataList.length > count) {
                quizDataList = quizDataList.slice(0, count);
            }

            // クイズ画面へ移行
            document.getElementById("loading-overlay").classList.add("hidden");
            document.getElementById("quiz-screen").classList.remove("hidden");
            
            showNextQuestion(finalCollectionRef);
        } catch (e) {
            console.error("Error fetching data: ", e);
            document.getElementById("loading-overlay").classList.add("hidden");
            document.getElementById("home-screen").classList.remove("hidden");
            
            let errMsg = e.message;
            if (e.message && e.message.includes("index")) {
                errMsg = "Firestoreの「インデックス(索引)」が必要です。コンソールに表示されているリンクをクリックして追加してください。";
            } else if (e.code === "permission-denied") {
                errMsg = "Firestoreの読み取り権限（セキュリティルール）で拒否されました。ルールの期限や、公開設定を見直してください。";
            } else if (e.message === "NoVocabularyDataFound") {
                errMsg = `セクション ${sectionVal} に該当するデータが取得できません。上のデバッグ情報をご確認ください。`;
            }
            
            alert(errMsg);
        }
    };

    // 問題表示
    async function showNextQuestion(collectionRef) {
        if (currentIndex >= quizDataList.length) {
            showResult();
            return;
        }

        const currentQuiz = quizDataList[currentIndex];
        document.getElementById("progress").innerText = `${currentIndex + 1} / ${quizDataList.length}`;
        document.getElementById("question-meaning").innerText = `意味：${currentQuiz.meaning}`;

        // ハズレの選択肢を作成（解決策A）
        let choices = [currentQuiz.word];
        const maxWords = 2442;
        
        let attempts = 0;
        // ハズレ作成時も、クイズ取得で使用した正確なコレクション参照(collectionRef)を使う
        const targetCol = collectionRef || collection(db, "vocabulary");

        while (choices.length < 4 && attempts < 20) {
            attempts++;
            const randomNum = Math.floor(Math.random() * maxWords) + 1;
            const randomId = "word_" + String(randomNum).padStart(4, '0');
            
            try {
                const rSnap = await getDoc(doc(targetCol, randomId));
                if (rSnap.exists()) {
                    const w = rSnap.data().word;
                    if (w && !choices.includes(w)) {
                        choices.push(w);
                    }
                }
            } catch (err) {
                console.warn(`Could not fetch wrong choice ${randomId}:`, err);
            }
        }

        // 緊急時フォールバック
        const fallbacks = ["understand", "express", "develop", "provide", "improve", "create"];
        let fIndex = 0;
        while (choices.length < 4) {
            const fallbackWord = fallbacks[fIndex % fallbacks.length];
            if (!choices.includes(fallbackWord)) {
                choices.push(fallbackWord);
            }
            fIndex++;
        }
        
        choices.sort(() => Math.random() - 0.5);
        const area = document.getElementById("choices-area");
        area.innerHTML = "";
        
        choices.forEach(c => {
            const btn = document.createElement("button");
            btn.innerText = c;
            btn.onclick = () => checkAnswer(btn, c === currentQuiz.word);
            area.appendChild(btn);
        });
    }

    // 正誤判定
    function checkAnswer(btn, isCorrect) {
        const buttons = document.querySelectorAll("#choices-area button");
        buttons.forEach(b => b.disabled = true);

        if (isCorrect) {
            score++;
            btn.classList.add("correct");
            playTone(880, 'sine', 0.4);
        } else {
            btn.classList.add("wrong");
            document.getElementById("app").classList.add("shake");
            playTone(150, 'sawtooth', 0.4);
            setTimeout(() => document.getElementById("app").classList.remove("shake"), 400);
        }

        setTimeout(() => {
            currentIndex++;
            showNextQuestion();
        }, 1200);
    }

    // 結果表示
    function showResult() {
        document.getElementById("quiz-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.remove("hidden");
        document.getElementById("final-score").innerText = `${quizDataList.length}問中 ${score}問正解！`;
    }
</script>

</body>
</html>
